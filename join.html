<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join | Khaled Fitness</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md bg-dark" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand text-warning fw-bold" href="index.html">
        Khaled Fitness
      </a>

      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="calculator.html">Calculator</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="nutrition.html">Nutrition</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="join.html" aria-current="page">Join</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    <h1>Join Khaled Fitness</h1>

    <form id="joinForm">
      <p>
        <label for="fullName">Name</label>
        <input id="fullName" name="fullName" type="text" required>
      </p>

      <p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </p>

      <p>
        <label for="joinGoal">Goal</label>
        <select id="joinGoal" name="goal" required>
          <option value="">Select goal</option>
          <option value="lose">Lose weight</option>
          <option value="maintain">Maintain weight</option>
          <option value="gain">Gain weight</option>
        </select>
      </p>

      <button type="submit">Add Request</button>
    </form>

    <section>
      <h2>Requests</h2>
      <p>Demo requests are saved in this browser.</p>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Email</th>
              <th scope="col">Goal</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="requestsTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Khaled Fitness</p>
  </footer>

  <script src="js/join.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
