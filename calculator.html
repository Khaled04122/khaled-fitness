<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md bg-dark" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand text-warning fw-bold" href="index.html">
        Khaled Fitness
      </a>

      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="calculator.html" aria-current="page">
              Calculator
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="nutrition.html">Nutrition</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="join.html">Join</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    <h1>Calorie Calculator</h1>
    <p>Estimate your daily calorie needs.</p>

    <form id="calorieForm">
      <p>
        <label for="age">Age (years)</label>
        <input type="number" id="age" name="age" min="18" required>
      </p>

      <p>
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" name="weight"
          min="0.1" step="0.1" required>
      </p>

      <p>
        <label for="height">Height (cm)</label>
        <input type="number" id="height" name="height" min="1" required>
      </p>

      <p>
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </p>

      <p>
        <label for="activity">Activity Level</label>
        <select id="activity" name="activity" required>
          <option value="">Select activity level</option>
          <option value="1.2">Sedentary — little or no exercise</option>
          <option value="1.375">Lightly active — 1–3 days/week</option>
          <option value="1.55">Moderately active — 3–5 days/week</option>
          <option value="1.725">Very active — 6–7 days/week</option>
        </select>
      </p>

      <p>
        <label for="goal">Goal</label>
        <select id="goal" name="goal" required>
          <option value="">Select your goal</option>
          <option value="lose">Lose weight</option>
          <option value="maintain">Maintain weight</option>
          <option value="gain">Gain weight</option>
        </select>
      </p>

      <button type="submit">Calculate</button>
    </form>

    <p id="result" aria-live="polite"></p>
  </main>

  <footer>
    <p>&copy; 2026 Khaled Fitness</p>
  </footer>

  <script src="js/calculator.js?v=2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
